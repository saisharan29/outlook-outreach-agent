name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
      - name: demo run (no keys, no account)
        run: |
          python -m outreach.cli demo
          DEMO=1 python -m outreach.cli "Preview email for Boulangerie Martin, Lyon" | grep -q "draft created"
